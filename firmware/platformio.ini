; PURSUIT-1 flight firmware.
;
; Two environments on purpose:
;
;   xiao     the real target. Seeed XIAO ESP32S3 Sense.
;   native   the same flight logic compiled for the host, so the mixer,
;            the watchdog, the arming interlocks and the throttle limiter
;            can be tested before a board exists. Everything safety-critical
;            is deliberately written free of Arduino headers so it can live
;            in both.
;
; The split is not tidiness. A motor mix with a sign error, or a watchdog that
; holds the last command, is not something to discover with props on.

[platformio]
default_envs = xiao

[env]
build_flags = -Wall -Wextra

[env:xiao]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; The Sense module carries 8MB of OPI PSRAM and the Arduino core does NOT
; bring it up on its own — without this the chip reports the RAM in esptool
; ("Embedded PSRAM 8MB") while psramFound() returns false at runtime, so the
; blackbox silently disables itself and prints "tuning will be blind". Caught
; on the first real boot, one step before it would have mattered: the log is
; the only way to tune a PID cascade, so losing it costs you the whole
; tuning phase rather than a feature.
;
; qio_opi, not qio_qspi: the flash is quad, the PSRAM is octal.
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; NOTE: the loop task stack is 8192 bytes from the SDK config, and
    ; redefining it here only produces a redefinition warning — the value is
    ; baked into the prebuilt framework. If the control loop ever needs more,
    ; move the work off loop() into its own pinned task rather than trying to
    ; grow this one.
lib_deps =
    ; VL53L1X belly rangefinder (Pololu 3415 carrier)
    pololu/VL53L1X@^1.3.1

[env:native]
platform = native
test_framework = unity
; Compile src/ into the test binary. Without this the tests build and then
; fail to link, because PlatformIO only builds src/ for tests when asked.
test_build_src = yes
; main.cpp is Arduino-only; the host build takes just the portable logic.
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env.build_flags}
    -DPURSUIT_HOST_BUILD
    -std=gnu++17
    -Iinclude
    -Isrc
